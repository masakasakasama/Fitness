<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0a0c"><title>REPS データ移行</title><style>:root{color-scheme:dark;--bg:#0a0a0c;--card:#17171b;--text:#f5f5f7;--muted:#8e8e98;--accent:#ffd119;--border:#2a2a31}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}main{max-width:520px;margin:0 auto;padding:28px 0 40px}h1{font-size:28px;margin:0 0 8px}p{color:var(--muted);line-height:1.7}.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:20px;margin-top:24px}.stat{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}.stat:last-child{border-bottom:0}.value{font-weight:800}button{width:100%;border:0;border-radius:16px;padding:17px 18px;font-size:17px;font-weight:800;background:var(--accent);color:#111;margin-top:20px}button:disabled{opacity:.45}.ok{color:#6ee7a8}.bad{color:#ff7b88}.small{font-size:12px;color:var(--muted);margin-top:14px}</style></head><body><main><h1>REPS データ移行</h1><p>旧Chrome/PWAに保存されている全トレーニング履歴を、Android版REPSへ1回だけ移す</p><div class="card"><div class="stat"><span>状態</span><span id="status" class="value">確認中</span></div><div class="stat"><span>セッション</span><span id="sessions" class="value">—</span></div><div class="stat"><span>セット</span><span id="sets" class="value">—</span></div><div class="stat"><span>体重記録</span><span id="weights" class="value">—</span></div><div class="stat"><span>最終更新</span><span id="updated" class="value">—</span></div></div><button id="migrateBtn" disabled>Android版REPSへ全データ移行</button><p class="small">押した後の共有画面で「REPS」を選ぶ。GitHubトークンやパスワードは移行しない</p></main><script>(()=>{const KEY='gym-tracker-v1';const raw=localStorage.getItem(KEY);const status=document.getElementById('status');const btn=document.getElementById('migrateBtn');if(!raw){status.textContent='旧データなし';status.className='value bad';return;}let data;try{data=JSON.parse(raw);}catch{status.textContent='データ破損';status.className='value bad';return;}const sessions=Array.isArray(data.sessions)?data.sessions:[];const setTotal=sessions.reduce((sum,s)=>sum+(s.exercises||[]).reduce((a,e)=>a+(e.sets||[]).length,0),0);document.getElementById('sessions').textContent=sessions.length;document.getElementById('sets').textContent=setTotal;document.getElementById('weights').textContent=Array.isArray(data.weights)?data.weights.length:0;document.getElementById('updated').textContent=data.updatedAt?new Date(data.updatedAt).toLocaleString('ja-JP'):'不明';status.textContent='移行可能';status.className='value ok';btn.disabled=false;btn.addEventListener('click',async()=>{const text='REPS_LEGACY_V1\n'+raw;try{if(!navigator.share)throw new Error('share unavailable');await navigator.share({title:'REPS 全データ移行',text});btn.textContent='共有先でREPSを選択';}catch(e){alert('共有画面を開けませんでした。Chromeからこのページを開いてください');}});})();</script></body></html>
