plugins {
    id 'com.android.application'
}

android {
    namespace 'com.masakasakasama.reps'
    compileSdk 35

    defaultConfig {
        applicationId 'com.masakasakasama.reps'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.5.1'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
