name: Build REPS Android APK

on:
  push:
    branches:
      - "claude/gym-tracking-app-SVUkz"
    paths:
      - "android/**"
      - "index.html"
      - "*.js"
      - "data.json"
      - "manifest.webmanifest"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle app assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('data.json','utf8'));fs.writeFileSync('android/app/src/main/assets/bundled-data-v1.js','window.REPS_BUNDLED_DATA = '+JSON.stringify(d)+';\n')"
          cp index.html android/app/src/main/assets/
          cp data.json android/app/src/main/assets/
          cp manifest.webmanifest android/app/src/main/assets/
          cp training-engine-v1.js android/app/src/main/assets/
          cp coach-logic-v2.js android/app/src/main/assets/
          cp latest-weight-v1.js android/app/src/main/assets/
          cp record-recommendation-v1.js android/app/src/main/assets/
          cp auto-rest-v1.js android/app/src/main/assets/
          cp daily-plan-v1.js android/app/src/main/assets/
          cp familiar-recommendations-v1.js android/app/src/main/assets/
          cp long-term-growth-v1.js android/app/src/main/assets/
          cp workout-flow-v1.js android/app/src/main/assets/
          cp native-bridge-v1.js android/app/src/main/assets/
          cp app-version-v1.js android/app/src/main/assets/
          find android/app/src/main/assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk REPS-v0.5.2.apk
          ls -lh REPS-v0.5.2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: REPS-v0.5.2-apk
          path: REPS-v0.5.2.apk
          if-no-files-found: error

