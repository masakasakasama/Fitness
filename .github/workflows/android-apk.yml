name: Build REPS Android APK

on:
  push:
    branches:
      - "claude/gym-tracking-app-SVUkz"
    paths:
      - "android/**"
      - "native-bridge-v1.js"
      - "sw.js"
      - "app-version-v1.js"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk REPS-v0.4.1.apk
          ls -lh REPS-v0.4.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: REPS-v0.4.1-apk
          path: REPS-v0.4.1.apk
          if-no-files-found: error

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-v0.4.1
          APK: REPS-v0.4.1.apk
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "REPS Android v0.4.1" \
              --notes "Android APK wrapper for REPS. Includes native rest-end notifications when the app is backgrounded."
          fi
