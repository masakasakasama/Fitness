name: Deploy REPS Migration Helper

on:
  push:
    branches:
      - "claude/gym-tracking-app-SVUkz"
    paths:
      - "migrate.html"
      - ".github/workflows/pages-migration.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-migration"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare migration-only site
        run: |
          mkdir -p _site
          cp migrate.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy migration helper
        id: deployment
        uses: actions/deploy-pages@v4
